<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СТОЛОТО ТИРАЖИ</title>
    <style>
        /* === Gruvbox — тема по умолчанию === */
        :root {
            --bg0: #282828;
            --bg1: #3c3836;
            --bg2: #504945;
            --bg3: #665c54;
            --fg0: #fbf1c7;
            --fg1: #ebdbb2;
            --fg2: #d5c4a1;
            --yellow: #d79921;
            --orange: #d65d0e;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg0);
            color: var(--fg1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === Вкладки === */
        .tabs-container {
            background: var(--bg1);
            border-bottom: 2px solid var(--bg2);
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .tabs-nav { display: flex; gap: 0; }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--fg2);
            padding: 12px 22px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: var(--fg0); }

        .tab-btn.active {
            color: var(--yellow);
            border-bottom-color: var(--yellow);
        }

        /* === Триколоночный layout === */
        .main-container {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
        }

        /* === Общая панель === */
        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
        }

        .panel-header {
            flex-shrink: 0;
            background: var(--bg2);
            color: var(--fg0);
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--bg3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-header .sub { color: var(--fg2); font-weight: 400; text-transform: none; letter-spacing: 0; }

        /* === Скролл-область панели === */
        .panel-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            background: var(--bg1);
        }

        .panel-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .panel-scroll::-webkit-scrollbar-track { background: var(--bg2); }
        .panel-scroll::-webkit-scrollbar-thumb {
            background: var(--bg3);
            border-radius: 4px;
            border: 2px solid var(--bg1);
        }
        .panel-scroll::-webkit-scrollbar-thumb:hover { background: var(--yellow); }

        /* === Ширины колонок === */
        .panel-left  { width: 310px; flex-shrink: 0; border-right: 1px solid var(--bg3); }
        .panel-right { width: 330px; flex-shrink: 0; border-left: 1px solid var(--bg3); }
        .panel-center { flex: 1; background: var(--bg1); }

        /* === Таблица тиражей: своя прокрутка, липкая шапка === */
        .panel-center .panel-scroll {
            overflow: auto;
            padding: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 350px;
        }

        th, td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--bg2);
            white-space: nowrap;
        }

        th {
            background: var(--bg2);
            font-weight: 600;
            font-size: 12px;
            color: var(--fg2);
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 1px 0 var(--bg3);
        }

        td.draw-id {
            font-weight: 600;
            color: var(--fg0);
        }

        tr:hover td { background: rgba(255,255,255,0.03); }

        /* === Числа === */
        .number-cell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
            font-weight: 500;
            border: 2px solid var(--bg2);
            transition: all 0.2s ease;
            background: var(--bg2);
            color: var(--fg1);
            user-select: none;
        }

        .number-cell:hover {
            background: var(--bg3);
            border-color: var(--fg2);
        }

        .number-cell.selected {
            background: var(--yellow);
            color: var(--bg0);
            border-color: var(--yellow);
            font-weight: bold;
        }

        .number-cell.highlighted {
            background: var(--yellow);
            color: var(--bg0);
            border-color: var(--yellow);
            font-weight: bold;
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.15); }
        }

        /* === Панель чисел === */
        #numberPanel {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 2px 0 8px;
        }

        /* === Статистика === */
        .stats-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--fg2);
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--bg2);
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            margin-bottom: 4px;
            background: var(--bg2);
            border-radius: 4px;
        }

        .stat-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg3);
            color: var(--fg0);
            font-weight: bold;
            flex-shrink: 0;
            font-size: 12px;
        }

        .stat-count { color: var(--yellow); font-weight: bold; font-size: 13px; }

        .empty-stats {
            text-align: center;
            padding: 15px;
            color: var(--fg2);
            font-style: italic;
            font-size: 13px;
        }

        /* === Кнопки === */
        .clear-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            background: var(--bg2);
            border: 1px solid var(--bg3);
            border-radius: 4px;
            color: var(--fg1);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-btn:hover { background: var(--bg3); color: var(--yellow); }

        /* === Адаптивность: стек с независимым скроллом каждой панели === */
        @media (max-width: 1000px) {
            body { overflow: hidden; }
            .main-container {
                flex-direction: column;
                overflow-y: auto;
            }
            .panel-left  { width: 100%; border-right: none; border-bottom: 1px solid var(--bg3); height: 34vh; }
            .panel-right { width: 100%; border-left: none;  border-top: 1px solid var(--bg3);    height: 34vh; }
            .panel-center { width: 100%; height: 34vh; border-bottom: 1px solid var(--bg3); }
            .panel-header { text-align: center; }
        }
    </style>
</head>
<body>

        </div>

            { id: 714, numbers: [28, 65, 70] }
        ];

        const drawsMap = { v10: drawsV10, v4: drawsV4 };

        let numberPanelCells = [];
        let tableNumberCells = [];
        let currentTab = 'v10';

        // === Создание таблицы тиражей ===
        function createDrawsTable() {
            const tbody = document.getElementById('drawsTable').querySelector('tbody');
            tbody.innerHTML = '';
            tableNumberCells = [];

            drawsMap[currentTab].forEach((draw) => {
                const row = document.createElement('tr');

                const idCell = document.createElement('td');
                idCell.textContent = draw.id;
                idCell.className = 'draw-id';
                row.appendChild(idCell);

                const numbersCell = document.createElement('td');
                numbersCell.style.color = 'var(--fg1)';

                draw.numbers.forEach((num) => {
                    const span = document.createElement('span');
                    span.className = 'number-cell';
                    span.textContent = num;
                    span.dataset.number = num;
                    span.addEventListener('click', () => toggleSelectionByNumber(num));
                    numbersCell.appendChild(span);
                    tableNumberCells.push(span);
                });

                row.appendChild(numbersCell);
                tbody.appendChild(row);
            });
        }

        // === Панель чисел ===
        function createNumberPanel() {
            const panel = document.getElementById('numberPanel');
            panel.innerHTML = '';
            numberPanelCells = [];

            for (let i = 1; i <= 90; i++) {
                const cell = document.createElement('div');
                cell.className = 'number-cell';
                cell.textContent = i;
                cell.dataset.number = i;
                cell.addEventListener('click', () => toggleSelectionByNumber(i));
                panel.appendChild(cell);
                numberPanelCells.push(cell);
            }
        }

        // === Синхронизация выделения ===
        function toggleSelectionByNumber(num) {
            const numInt = parseInt(num);
            const panelCell = numberPanelCells.find(c => parseInt(c.dataset.number) === numInt);
            const tableCells = tableNumberCells.filter(c => parseInt(c.dataset.number) === numInt);

            const isSelected = panelCell && panelCell.classList.contains('selected');

            if (isSelected) {
                if (panelCell) panelCell.classList.remove('selected');
                tableCells.forEach(c => c.classList.remove('selected'));
            } else {
                if (panelCell) panelCell.classList.add('selected');
                tableCells.forEach(c => c.classList.add('selected'));
            }

            highlightMatchingNumbers();
            displayStatistics();
        }

        // === Подсветка совпадений (включено по умолчанию) ===
        function highlightMatchingNumbers() {
            const selectedNumbers = numberPanelCells
                .filter(c => c.classList.contains('selected'))
                .map(c => parseInt(c.dataset.number));

            tableNumberCells.forEach(c => c.classList.remove('highlighted'));

            if (selectedNumbers.length === 0) return;

            tableNumberCells.forEach(cell => {
                if (selectedNumbers.includes(parseInt(cell.dataset.number))) {
                    cell.classList.add('highlighted');
                }
            });
        }

        // === Статистика (правая панель) ===
        function displayStatistics() {
            const container = document.getElementById('statsContainer');

            const selectedNumbers = numberPanelCells
                .filter(c => c.classList.contains('selected'))
                .map(c => parseInt(c.dataset.number))
                .filter(n => !isNaN(n));

            const emptyHtml = '<div class="empty-stats">Выберите числа для отображения статистики</div>';

            if (selectedNumbers.length === 0) {
                container.innerHTML = emptyHtml;
                return;
            }

            const draws = drawsMap[currentTab];
            const stats = {};
            selectedNumbers.forEach(n => { stats[n] = 0; });

            draws.forEach(draw => {
                draw.numbers.forEach(num => {
                    if (selectedNumbers.includes(num)) stats[num]++;
                });
            });

            const sorted = Object.entries(stats).sort((a, b) => b[1] - a[1]);

            container.innerHTML = buildStatsHtml(sorted, draws.length, selectedNumbers.length);
            container.scrollTop = 0;
        }

        function buildStatsHtml(sorted, totalDraws, totalSelected) {
            let html = '<div class="stats-header"><span>Число</span><span>Кол-во выпадений</span></div>';
            html += `<div class="empty-stats" style="margin-top:-4px;padding:0 0 8px;text-align:left;font-style:normal;">Тиражей в таблице: <b style="color:var(--fg0)">${totalDraws}</b> · выбрано чисел: <b style="color:var(--yellow)">${totalSelected}</b></div>`;
            sorted.forEach(([num, count]) => {
                html += `<div class="stat-item">
                    <div class="stat-number">${num}</div>
                    <span class="stat-count">${count} раз(а)</span>
                </div>`;
            });
            return html;
        }

        // === Очистка ===
        function clearSelections() {
            numberPanelCells.forEach(c => c.classList.remove('selected'));
            tableNumberCells.forEach(c => c.classList.remove('selected'));
            highlightMatchingNumbers();
            displayStatistics();
        }

        // === Вкладки ===
        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            createDrawsTable();
            highlightMatchingNumbers();
            displayStatistics();
            // Возвращаем таблицу к началу
            const scrollArea = document.querySelector('.panel-center .panel-scroll');
            if (scrollArea) scrollArea.scrollTop = 0;
        }

        // === Инициализация ===
        document.addEventListener('DOMContentLoaded', () => {
            createDrawsTable();
            createNumberPanel();
            displayStatistics();

            document.getElementById('clearButton').addEventListener('click', clearSelections);

            document.querySelectorAll('.tab-btn').forEach((btn) => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });
        });
    </script>
</body>
</html>
